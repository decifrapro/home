[project]
name = "decifra-pro-backend"
version = "2.0.0"
description = "Motor e processadores multimodais do Decifra Pro"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2,<3.0",
  "python-magic>=0.4.27,<0.5",
  "httpx>=0.27,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "Pillow>=10.3,<12.0",
  "selectolax>=0.3.21,<0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  "ruff>=0.5,<1.0",
]
browser = [
  "playwright>=1.44,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008", "E501"]
